  # gradle — Case 10 origin (Java / Spring Boot)
  - package-ecosystem: "gradle"
    directory: "/cases/10-java-to-kotlin/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # Spring Boot 4 es ruptura; 3.5.x sigue recibiendo parches.
      - dependency-name: "org.springframework.boot"
        update-types:
          - "version-update:semver-major"
      # Ktor 3 migra a kotlinx-io; sin advisory que lo justifique.
      - dependency-name: "io.ktor:ktor-server-core-jvm"
        update-types:
          - "version-update:semver-major"
      # Idem.
      - dependency-name: "io.ktor:ktor-server-netty-jvm"
        update-types:
          - "version-update:semver-major"
      # La 1.6 cambia de linea; 1.5.18 esta al dia y sin advisory.
      - dependency-name: "ch.qos.logback:logback-classic"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Shadow 9 exige revisar el toolchain; sin advisory.
      - dependency-name: "com.gradleup.shadow"
        update-types:
          - "version-update:semver-major"
      # Kotlin 2.4 arrastra Gradle 9; sin advisory.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

