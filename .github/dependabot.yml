version: 2
# Trigger re-evaluation: 2026-05-05 (diagnose persistent gomod/npm errors)
updates:
  # GitHub Actions — detecta nuevas versiones de actions usadas en workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Python (pip) — dependencias del hub principal y scripts
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Python — Case 01 origin
  - package-ecosystem: "pip"
    directory: "/cases/01-python-to-php/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Python — Case 02 origin
  - package-ecosystem: "pip"
    directory: "/cases/02-python-to-go/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Python — Case 09 destination (FastAPI gateway)
  - package-ecosystem: "pip"
    directory: "/cases/09-python-to-gateway/dest"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Docker — imágenes base en Dockerfiles de los casos
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # 3.13 es la rama elegida: 3.14+ reduce las ruedas precompiladas disponibles para los locks con hash.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"

  # Go — Case 02 destination
  - package-ecosystem: "gomod"
    directory: "/cases/02-python-to-go/dest"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Go — Case 03 origin
  - package-ecosystem: "gomod"
    directory: "/cases/03-go-to-node/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Go — Case 06 origin
  - package-ecosystem: "gomod"
    directory: "/cases/06-go-to-symfony/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  # Rust — Case 07 origin
  - package-ecosystem: "cargo"
    directory: "/cases/07-rust-to-ruby/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # reqwest 0.13 es ruptura de API en una crate 0.x; sin advisory.
      - dependency-name: "reqwest"
        update-types:
          - "version-update:semver-minor"
      # rumqttc 0.25 es ruptura de API en una crate 0.x; sin advisory.
      - dependency-name: "rumqttc"
        update-types:
          - "version-update:semver-minor"

  # Rust — Case 17 origin. Faltaba: tiene Cargo.toml Y Cargo.lock, asi que las
  # transitivas (tokio y compania) solo se mantienen al dia si Dependabot las ve.
  - package-ecosystem: "cargo"
    directory: "/cases/17-mqtt-rust-to-node/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # reqwest 0.13 es ruptura de API en una crate 0.x; sin advisory.
      - dependency-name: "reqwest"
        update-types:
          - "version-update:semver-minor"
      # rumqttc 0.25 es ruptura de API en una crate 0.x; sin advisory.
      - dependency-name: "rumqttc"
        update-types:
          - "version-update:semver-minor"

  # npm — Case 03 destination (Node.js)
  - package-ecosystem: "npm"
    directory: "/cases/03-go-to-node/dest"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # Express 5 es ruptura; los advisories de la 4 se cierran con 4.22.3 + overrides.
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
      # Next 16 es ruptura; 15.5.28 esta sobre el piso de sus 38 advisories.
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      # El driver 7 es ruptura y el 6 no tiene advisory abierto.
      - dependency-name: "mongodb"
        update-types:
          - "version-update:semver-major"

  # npm — Case 04 origin (Node.js)
  - package-ecosystem: "npm"
    directory: "/cases/04-node-to-fastapi/origin"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # Express 5 es ruptura; los advisories de la 4 se cierran con 4.22.3 + overrides.
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
      # Next 16 es ruptura; 15.5.28 esta sobre el piso de sus 38 advisories.
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      # El driver 7 es ruptura y el 6 no tiene advisory abierto.
      - dependency-name: "mongodb"
        update-types:
          - "version-update:semver-major"

