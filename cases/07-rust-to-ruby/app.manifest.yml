id: "07"
name: "Rust -> n8n -> Ruby"
path: "cases/07-rust-to-ruby"
status: "ready"
origin:
  language: "rust"
  entrypoint: "origin/src/main.rs"
destination:
  language: "ruby"
  port: 8087
  url: "http://localhost:8087"
database:
  engine: "cassandra"
  version: "4.1"
stack: ["rust", "n8n", "ruby", "sinatra"]
description: "Integración de alta performance Rust con Ruby Sinatra"

# Manifiesto de seguridad de versiones del caso: que runtime y que dependencia
# estan en que version, y contra que advisory de OSV. Ver docs/CVE_REMEDIATION_v4.11.0.md.
security_manifest: "security.yml"
