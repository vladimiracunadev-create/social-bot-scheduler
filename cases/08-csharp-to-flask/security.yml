# ==================================================================================================
# Caso 08 — manifiesto de seguridad de versiones
# ==================================================================================================
# Que es esto
#   El registro de POR QUE cada runtime y cada dependencia de este caso estan en la version en
#   que estan. `app.manifest.yml` dice QUE tecnologias usa el caso; este fichero dice en que
#   version y contra que advisory.
#
# Como se obtuvo
#   - Advisories: OSV.dev, endpoint /v1/query, consultando la version exacta que estaba pinneada
#     antes del cambio (no rangos ni heuristicas).
#   - Fin de soporte: endoflife.date.
#   - Existencia de los tags de imagen: Docker Hub / MCR, antes de escribir el Dockerfile.
#
# Como leerlo
#   `reason` explica por que se movio la version:
#     eol                    el runtime ya no recibe parches de seguridad
#     fin-de-soporte         sigue recibiendo parches pero el soporte activo ya cerro
#     fin-de-soporte-activo  en modo solo-seguridad
#     mantenimiento          sin advisory abierto; se sube para no acumular deuda
#     endurecimiento         el cambio cierra una superficie, no un CVE concreto
#     sin-cambio             se evaluo y se deja como esta (el motivo va en `detail`)
#   `severity` es la mas alta que OSV reporta para los advisories listados; `-` = sin advisory.
# ==================================================================================================

case: "08"
name: "C#/.NET -> n8n -> Flask"
lab_version: "4.11.0"
reviewed: "2026-11-01"
sources:
  advisories: "https://osv.dev/ (/v1/query por version exacta)"
  end_of_life: "https://endoflife.date/"

# --- Runtimes de lenguaje / imagenes base -------------------------------------------
runtimes:
  - component: "origin"
    language: "dotnet"
    from: "net6.0"
    to: "net10.0"
    reason: eol
    applied_in: "`cases/08-csharp-to-flask/origin/SocialBot.csproj` (TargetFramework)"
    detail: >-
      .NET 6 quedo EOL el 2024-11-12: dos anos sin parches de runtime. .NET 10 es LTS hasta
      2028-11-14. El CI pasa de dotnet 6.0.x a 10.0.x.
  - component: "dest"
    language: "python"
    from: "3.11-slim (bookworm)"
    to: "3.13-slim-trixie"
    reason: fin-de-soporte-activo
    applied_in: "`cases/08-csharp-to-flask/dest/Dockerfile` (FROM de la imagen); `Dockerfile` (FROM de la imagen)"
    detail: >-
      Ademas de la version de Python, la base salta de Debian 12 a 13; el repositorio de msodbcsql18
      apunta ahora a debian/13 trixie.

# --- Dependencias ------------------------------------------------------------------
dependencies:
  - ecosystem: "PyPI"
    package: "werkzeug"
    from: "3.1.8"
    to: "3.1.9"
    advisories:
      - "GHSA-g6x2-hccm-hh4m"
      - "PYSEC-2026-4312"
    severity: "MODERATE"
    applied_in: "`cases/08-csharp-to-flask/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      safe_join() aceptaba nombres de dispositivo especiales de Windows.
  - ecosystem: "PyPI"
    package: "flask"
    from: "3.1.x"
    to: "3.1.3"
    advisories: []
    severity: "-"
    applied_in: "`cases/08-csharp-to-flask/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      Ultimo parche de la linea 3.1.
  - ecosystem: "PyPI"
    package: "pyodbc"
    from: "5.x"
    to: "5.3.0"
    advisories: []
    severity: "-"
    applied_in: "`cases/08-csharp-to-flask/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      Mantenimiento.
