# ==================================================================================================
# Caso 16 — manifiesto de seguridad de versiones
# ==================================================================================================
# Que es esto
#   El registro de POR QUE cada runtime y cada dependencia de este caso estan en la version en
#   que estan. `app.manifest.yml` dice QUE tecnologias usa el caso; este fichero dice en que
#   version y contra que advisory.
#
# Como se obtuvo
#   - Advisories: OSV.dev, endpoint /v1/query, consultando la version exacta que estaba pinneada
#     antes del cambio (no rangos ni heuristicas).
#   - Fin de soporte: endoflife.date.
#   - Existencia de los tags de imagen: Docker Hub / MCR, antes de escribir el Dockerfile.
#
# Como leerlo
#   `reason` explica por que se movio la version:
#     eol                    el runtime ya no recibe parches de seguridad
#     fin-de-soporte         sigue recibiendo parches pero el soporte activo ya cerro
#     fin-de-soporte-activo  en modo solo-seguridad
#     mantenimiento          sin advisory abierto; se sube para no acumular deuda
#     endurecimiento         el cambio cierra una superficie, no un CVE concreto
#     sin-cambio             se evaluo y se deja como esta (el motivo va en `detail`)
#   `severity` es la mas alta que OSV reporta para los advisories listados; `-` = sin advisory.
# ==================================================================================================

case: "16"
name: "Apollo GraphQL -> n8n -> Hasura + TimescaleDB"
lab_version: "4.11.0"
reviewed: "2026-11-01"
sources:
  advisories: "https://osv.dev/ (/v1/query por version exacta)"
  end_of_life: "https://endoflife.date/"

# --- Runtimes de lenguaje / imagenes base -------------------------------------------
runtimes:
  - component: "origin+dest"
    language: "nodejs"
    from: "20-alpine"
    to: "24-alpine"
    reason: eol
    detail: >-
      Node 20 EOL 2026-04-30.
  - component: "origin+dest"
    language: "pnpm"
    from: "10.0.0"
    to: "11.2.2"
    reason: endurecimiento
    detail: >-
      Scripts de instalacion bloqueados (se bloqueo de hecho el postinstall de @apollo/protobufjs
      durante la verificacion) + cuarentena de 24 h.

# --- Dependencias ------------------------------------------------------------------
dependencies:
  - ecosystem: "npm"
    package: "@apollo/server"
    from: "4.11.3"
    to: "5.5.1"
    advisories:
      - "CVE-2026-23897"
      - "GHSA-9q82-xgwf-vj6h"
    severity: "HIGH"
    note: >-
      DoS con startStandaloneServer (corregido en 4.13.0) y bypass de la proteccion XS-Search, que
      solo se cierra en 5.5.0. El salto de major es seguro aqui: ApolloServer + startStandaloneServer
      mantienen la misma firma y se verifico arrancando el emisor y resolviendo una query real.
  - ecosystem: "npm"
    package: "graphql"
    from: "16.10.0"
    to: "16.14.2"
    advisories: []
    severity: "-"
    note: >-
      Sin advisory. Se queda en 16.x porque @apollo/server 5 exige graphql ^16.11.0.
  - ecosystem: "npm"
    package: "express"
    from: "4.21.2"
    to: "4.22.3"
    advisories: []
    severity: "-"
    note: >-
      Ultimo parche de la linea 4.x.
  - ecosystem: "npm"
    package: "proxy-addr"
    from: "transitiva < 2.0.8"
    to: "override >=2.0.8"
    advisories:
      - "GHSA-jqcg-44mw-7w3h"
    severity: "CRITICAL"
    note: >-
      Transitiva de express en el receiver.
  - ecosystem: "npm"
    package: "body-parser"
    from: "transitiva < 1.20.9"
    to: "override >=1.20.9 <2.0.0"
    advisories:
      - "GHSA-27r3-jxmh-p828"
      - "GHSA-v422-hmwv-36x6"
    severity: "HIGH"
    note: >-
      Transitiva de express.
  - ecosystem: "npm"
    package: "qs"
    from: "transitiva <= 6.16.0"
    to: "override >=6.16.1 <7.0.0"
    advisories:
      - "GHSA-4mjr-xmp4-gh2g"
      - "GHSA-x5fp-wj9c-mxmx"
      - "GHSA-6pq8-jhm2-2vcw"
    severity: "MODERATE"
    note: >-
      Transitiva de express.
