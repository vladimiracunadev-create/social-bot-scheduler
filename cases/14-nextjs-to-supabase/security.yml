# ==================================================================================================
# Caso 14 — manifiesto de seguridad de versiones
# ==================================================================================================
# Que es esto
#   El registro de POR QUE cada runtime y cada dependencia de este caso estan en la version en
#   que estan. `app.manifest.yml` dice QUE tecnologias usa el caso; este fichero dice en que
#   version y contra que advisory.
#
# Como se obtuvo
#   - Advisories: OSV.dev, endpoint /v1/query, consultando la version exacta que estaba pinneada
#     antes del cambio (no rangos ni heuristicas).
#   - Fin de soporte: endoflife.date.
#   - Existencia de los tags de imagen: Docker Hub / MCR, antes de escribir el Dockerfile.
#
# Como leerlo
#   `reason` explica por que se movio la version:
#     eol                    el runtime ya no recibe parches de seguridad
#     fin-de-soporte         sigue recibiendo parches pero el soporte activo ya cerro
#     fin-de-soporte-activo  en modo solo-seguridad
#     mantenimiento          sin advisory abierto; se sube para no acumular deuda
#     endurecimiento         el cambio cierra una superficie, no un CVE concreto
#     sin-cambio             se evaluo y se deja como esta (el motivo va en `detail`)
#   `severity` es la mas alta que OSV reporta para los advisories listados; `-` = sin advisory.
# ==================================================================================================

case: "14"
name: "Next.js -> n8n -> Supabase (PostgREST)"
lab_version: "4.11.0"
reviewed: "2026-11-01"
sources:
  advisories: "https://osv.dev/ (/v1/query por version exacta)"
  end_of_life: "https://endoflife.date/"

# --- Runtimes de lenguaje / imagenes base -------------------------------------------
runtimes:
  - component: "origin+dest"
    language: "nodejs"
    from: "20-alpine"
    to: "24-alpine"
    reason: eol
    detail: >-
      Node 20 EOL 2026-04-30.
  - component: "origin+dest"
    language: "pnpm"
    from: "10.0.0"
    to: "11.2.2"
    reason: endurecimiento
    detail: >-
      Scripts de instalacion bloqueados + cuarentena de 24 h + lockfiles commiteados.

# --- Dependencias ------------------------------------------------------------------
dependencies:
  - ecosystem: "npm"
    package: "next"
    from: "15.1.3"
    to: "15.5.28"
    advisories:
      - "GHSA-2464-fhr4-w9xw"
      - "GHSA-2xp9-vwfh-vxw4"
      - "CVE-2026-44573"
      - "CVE-2025-49826"
      - "CVE-2026-64649"
      - "GHSA-8h8q-6873-q5fj"
    severity: "CRITICAL"
    note: >-
      38 advisories, dos de ellos RCE sin autenticar en la Image Optimization API (SVG y AVIF).
      Tambien bypass de middleware con i18n, SSRF en Server Actions y DoS por cache poisoning. Se
      queda en la linea 15.x: el salto a Next 16 es ruptura.
  - ecosystem: "npm"
    package: "postcss"
    from: "transitiva <= 8.5.22"
    to: "override >=8.5.23"
    advisories:
      - "GHSA-6g55-p6wh-862q"
      - "GHSA-r28c-9q8g-f849"
      - "GHSA-fxqj-rqcc-2cmp"
      - "GHSA-qx2v-qp2m-jg93"
    severity: "HIGH"
    note: >-
      Lectura arbitraria de ficheros .map via sourceMappingURL controlado por el atacante; next
      15.5.28 todavia arrastra la version vulnerable.
  - ecosystem: "npm"
    package: "react"
    from: "19.0.0"
    to: "19.3.1"
    advisories: []
    severity: "-"
    note: >-
      Sin advisory: mantenimiento.
  - ecosystem: "npm"
    package: "react-dom"
    from: "19.0.0"
    to: "19.3.1"
    advisories: []
    severity: "-"
    note: >-
      Sin advisory: mantenimiento.
  - ecosystem: "npm"
    package: "express"
    from: "4.21.2"
    to: "4.22.3"
    advisories: []
    severity: "-"
    note: >-
      Sin advisory en 4.21.2; se sube al ultimo parche de la linea 4.x.
  - ecosystem: "npm"
    package: "proxy-addr"
    from: "transitiva < 2.0.8"
    to: "override >=2.0.8"
    advisories:
      - "GHSA-jqcg-44mw-7w3h"
    severity: "CRITICAL"
    note: >-
      Transitiva de express.
  - ecosystem: "npm"
    package: "body-parser"
    from: "transitiva < 1.20.9"
    to: "override >=1.20.9 <2.0.0"
    advisories:
      - "GHSA-27r3-jxmh-p828"
      - "GHSA-v422-hmwv-36x6"
    severity: "HIGH"
    note: >-
      Transitiva de express.
  - ecosystem: "npm"
    package: "qs"
    from: "transitiva <= 6.16.0"
    to: "override >=6.16.1 <7.0.0"
    advisories:
      - "GHSA-4mjr-xmp4-gh2g"
      - "GHSA-x5fp-wj9c-mxmx"
      - "GHSA-6pq8-jhm2-2vcw"
    severity: "MODERATE"
    note: >-
      Transitiva de express.
