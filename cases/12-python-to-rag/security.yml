# ==================================================================================================
# Caso 12 — manifiesto de seguridad de versiones
# ==================================================================================================
# Que es esto
#   El registro de POR QUE cada runtime y cada dependencia de este caso estan en la version en
#   que estan. `app.manifest.yml` dice QUE tecnologias usa el caso; este fichero dice en que
#   version y contra que advisory.
#
# Como se obtuvo
#   - Advisories: OSV.dev, endpoint /v1/query, consultando la version exacta que estaba pinneada
#     antes del cambio (no rangos ni heuristicas).
#   - Fin de soporte: endoflife.date.
#   - Existencia de los tags de imagen: Docker Hub / MCR, antes de escribir el Dockerfile.
#
# Como leerlo
#   `reason` explica por que se movio la version:
#     eol                    el runtime ya no recibe parches de seguridad
#     fin-de-soporte         sigue recibiendo parches pero el soporte activo ya cerro
#     fin-de-soporte-activo  en modo solo-seguridad
#     mantenimiento          sin advisory abierto; se sube para no acumular deuda
#     endurecimiento         el cambio cierra una superficie, no un CVE concreto
#     sin-cambio             se evaluo y se deja como esta (el motivo va en `detail`)
#   `severity` es la mas alta que OSV reporta para los advisories listados; `-` = sin advisory.
# ==================================================================================================

case: "12"
name: "Python -> n8n -> RAG (FastAPI + pgvector)"
lab_version: "4.11.0"
reviewed: "2026-11-01"
sources:
  advisories: "https://osv.dev/ (/v1/query por version exacta)"
  end_of_life: "https://endoflife.date/"

# --- Runtimes de lenguaje / imagenes base -------------------------------------------
runtimes:
  - component: "dest"
    language: "python"
    from: "3.11-slim"
    to: "3.13-slim-trixie"
    reason: fin-de-soporte-activo
    applied_in: "`cases/12-python-to-rag/dest/Dockerfile` (FROM de la imagen); `Dockerfile` (FROM de la imagen)"
    detail: >-
      Python 3.11 en modo solo-seguridad; base Debian 12 -> 13.

# --- Dependencias ------------------------------------------------------------------
dependencies:
  - ecosystem: "PyPI"
    package: "fastapi"
    from: "0.115.6"
    to: "0.162.0"
    advisories: []
    severity: "-"
    applied_in: "`cases/12-python-to-rag/dest/requirements.in` (pin de entrada (se recompila con hash)); `cases/12-python-to-rag/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      0.115.6 no tiene advisory propio, pero resolvia starlette < 0.49.1 en tiempo de build. Ahora el
      lock trae hashes y la transitiva queda fijada.
  - ecosystem: "PyPI"
    package: "uvicorn"
    from: "0.34.0"
    to: "0.54.0"
    advisories: []
    severity: "-"
    applied_in: "`cases/12-python-to-rag/dest/requirements.in` (pin de entrada (se recompila con hash)); `cases/12-python-to-rag/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      Mantenimiento.
  - ecosystem: "PyPI"
    package: "psycopg2-binary"
    from: "2.9.10"
    to: "2.9.13"
    advisories: []
    severity: "-"
    applied_in: "`cases/12-python-to-rag/dest/requirements.in` (pin de entrada (se recompila con hash)); `cases/12-python-to-rag/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      Mantenimiento.
  - ecosystem: "PyPI"
    package: "requirements.txt"
    from: "3 pins sin hash"
    to: "15 pins con hash SHA256"
    advisories: []
    severity: "-"
    applied_in: >-
      `cases/12-python-to-rag/dest/requirements.in` (pins de entrada) + `requirements.txt` (lock con hash SHA256, 15 paquetes)
    note: >-
      El fichero pasa a compilarse con uv --generate-hashes, de modo que pip entra en modo
      --require-hashes y las transitivas dejan de resolverse en el build.
