# --- Hallazgos ABIERTOS (conocidos y NO remediados) --------------------------------
# Lo contrario de `dependencies`: esto sigue vulnerable. `rumqttc` se compila con
# default-features = false (sin TLS), asi que aqui no entra rustls; tokio si.
open_findings:
  - ecosystem: "crates.io"
    package: "tokio"
    version: "1.52.3"
    advisories:
      - "RUSTSEC-2026-0386"
    severity: "SIN-CLASIFICAR"
    fix_version: "1.53.3"
    blocked_by: >-
      Requiere `cargo update -p <crate>` en una maquina con toolchain Rust: el Cargo.lock lleva checksum por crate y la lista de dependencias de cada version, asi que editarlo a mano no es verificable y romperia el build. Dependabot (ecosistema cargo) lo regenera correctamente.
    note: >-
      Transitiva de rumqttc: AsyncFd::new y constructores afines violan la seguridad de
      E/S (I/O safety). RUSTSEC no publica severidad textual para este advisory.
