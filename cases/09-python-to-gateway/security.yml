    severity: "MODERATE"
    applied_in: "`cases/09-python-to-gateway/dest/requirements.in` (pin de entrada (se recompila con hash)); `cases/09-python-to-gateway/dest/requirements.txt` (lock con hash SHA256)"
    note: >-
      Reuso insegable de fichero temporal en extract_zipped_paths().
  - ecosystem: "PyPI"
