id: "05"
name: "Laravel -> n8n -> React"
path: "cases/05-laravel-to-react"
status: "ready"
origin:
  language: "php"
  entrypoint: "origin/ArtisanPost.php"
destination:
  language: "react"
  port: 8085
  url: "http://localhost:8085"
database:
  engine: "mongodb"
  version: "6.0"
stack: ["laravel", "n8n", "react", "vite"]
description: "Integracion de comando Laravel con frontend React"

# Manifiesto de seguridad de versiones del caso: que runtime y que dependencia
# estan en que version, y contra que advisory de OSV. Ver docs/CVE_REMEDIATION_v4.11.0.md.
security_manifest: "security.yml"
