id: "02"
name: "Python -> n8n -> Go"
path: "cases/02-python-to-go"
status: "ready"
origin:
  language: "python"
  entrypoint: "origin/bot.py"
destination:
  language: "go"
  port: 8082
  url: "http://localhost:8082"
database:
  engine: "mariadb"
  version: "10.11"
stack: ["python", "n8n", "go"]
description: "Integración de bot Python con dashboard escrito en Go (Gin)"

# Manifiesto de seguridad de versiones del caso: que runtime y que dependencia
# estan en que version, y contra que advisory de OSV. Indice de cambios y
# procedimiento en docs/VERSION_UPGRADES.md.
security_manifest: "security.yml"
