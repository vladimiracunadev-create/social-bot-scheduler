# ==================================================================================================
# Caso 03 — manifiesto de seguridad de versiones
# ==================================================================================================
# Que es esto
#   El registro de POR QUE cada runtime y cada dependencia de este caso estan en la version en
#   que estan. `app.manifest.yml` dice QUE tecnologias usa el caso; este fichero dice en que
#   version y contra que advisory.
#
# Como se obtuvo
#   - Advisories: OSV.dev, endpoint /v1/query, consultando la version exacta que estaba pinneada
#     antes del cambio (no rangos ni heuristicas).
#   - Fin de soporte: endoflife.date.
#   - Existencia de los tags de imagen: Docker Hub / MCR, antes de escribir el Dockerfile.
#
# Como leerlo
#   `reason` explica por que se movio la version:
#     eol                    el runtime ya no recibe parches de seguridad
#     fin-de-soporte         sigue recibiendo parches pero el soporte activo ya cerro
#     fin-de-soporte-activo  en modo solo-seguridad
#     mantenimiento          sin advisory abierto; se sube para no acumular deuda
#     endurecimiento         el cambio cierra una superficie, no un CVE concreto
#     sin-cambio             se evaluo y se deja como esta (el motivo va en `detail`)
#   `severity` es la mas alta que OSV reporta para los advisories listados; `-` = sin advisory.
# ==================================================================================================

case: "03"
name: "Go -> n8n -> Node.js"
lab_version: "4.11.0"
reviewed: "2026-11-01"
sources:
  advisories: "https://osv.dev/ (/v1/query por version exacta)"
  end_of_life: "https://endoflife.date/"

# --- Runtimes de lenguaje / imagenes base -------------------------------------------
runtimes:
  - component: "origin"
    language: "go"
    from: "1.21 (go.mod)"
    to: "1.27 (go.mod)"
    reason: eol
    applied_in: "`cases/03-go-to-node/origin/go.mod` (directiva go / require)"
    detail: >-
      Go 1.21 EOL 2024-08-13; 72 advisories de stdlib.
  - component: "dest"
    language: "nodejs"
    from: "20-alpine"
    to: "24-alpine"
    reason: eol
    applied_in: "`cases/03-go-to-node/dest/Dockerfile` (FROM de la imagen); `docker-compose.yml` (image del servicio)"
    detail: >-
      Node.js 20 quedo EOL el 2026-04-30 (ultimo parche 20.20.2). Node 24 LTS llega a 2028-04-30.
  - component: "dest"
    language: "pnpm"
    from: "10.0.0"
    to: "11.2.2"
    reason: endurecimiento
    applied_in: "`cases/03-go-to-node/dest/Dockerfile` (FROM de la imagen); `cases/03-go-to-node/dest/package.json` (dependencias / packageManager); `docker-compose.yml` (image del servicio)"
    detail: >-
      pnpm 11 bloquea scripts de instalacion por defecto y aplica cuarentena de 24 h
      (minimumReleaseAge). Node 24 cumple el requisito Node >= 22.13.

# --- Dependencias ------------------------------------------------------------------
dependencies:
  - ecosystem: "npm"
    package: "express"
    from: "^4.18.2"
    to: "^4.22.3"
    advisories:
      - "CVE-2024-43796"
      - "CVE-2024-29041"
    severity: "MODERATE"
    applied_in: "`cases/03-go-to-node/dest/package.json` (dependencias / packageManager)"
    note: >-
      XSS via response.redirect() y open redirect con URLs malformadas.
  - ecosystem: "npm"
    package: "axios"
    from: "^1.18.0"
    to: "^1.21.0"
    advisories:
      - "CVE-2026-101898"
      - "CVE-2026-101901"
      - "CVE-2026-101903"
      - "CVE-2026-101905"
      - "CVE-2026-101906"
      - "CVE-2026-101907"
    severity: "HIGH"
    applied_in: "`cases/03-go-to-node/dest/package.json` (dependencias / packageManager)"
    note: >-
      El adaptador HTTP/2 saltaba los controles de DNS y proxy, ReDoS en el parser de data: URL,
      prototype pollution en el adaptador Node y maxRedirects: 0 ignorado.
  - ecosystem: "npm"
    package: "pg"
    from: "^8.11.3"
    to: "^8.23.1"
    advisories: []
    severity: "-"
    applied_in: "`cases/03-go-to-node/dest/package.json` (dependencias / packageManager)"
    note: >-
      Sin advisory: mantenimiento.
  - ecosystem: "npm"
    package: "proxy-addr"
    from: "transitiva < 2.0.8"
    to: "override >=2.0.8"
    advisories:
      - "GHSA-jqcg-44mw-7w3h"
    severity: "CRITICAL"
    applied_in: "`cases/03-go-to-node/dest/pnpm-workspace.yaml` (override de pnpm)"
    note: >-
      Spoofing de IP con direcciones IPv4 mapeadas en IPv6; express 4.22.3 todavia arrastra la version
      vulnerable.
  - ecosystem: "npm"
    package: "body-parser"
    from: "transitiva < 1.20.9"
    to: "override >=1.20.9 <2.0.0"
    advisories:
      - "GHSA-27r3-jxmh-p828"
      - "GHSA-v422-hmwv-36x6"
    severity: "HIGH"
    applied_in: "`cases/03-go-to-node/dest/pnpm-workspace.yaml` (override de pnpm)"
    note: >-
      DoS por bytes residuales tras un cuerpo comprimido y limite de tamano ignorado.
  - ecosystem: "npm"
    package: "qs"
    from: "transitiva <= 6.16.0"
    to: "override >=6.16.1 <7.0.0"
    advisories:
      - "GHSA-4mjr-xmp4-gh2g"
      - "GHSA-x5fp-wj9c-mxmx"
      - "GHSA-6pq8-jhm2-2vcw"
    severity: "MODERATE"
    applied_in: "`cases/03-go-to-node/dest/pnpm-workspace.yaml` (override de pnpm)"
    note: >-
      DoS via isBuffer controlado por el atacante y bypass del array-limit.
  - ecosystem: "npm"
    package: "follow-redirects"
    from: "transitiva <= 1.16.1"
    to: "override >=1.16.2"
    advisories:
      - "GHSA-mrwp-f3q8-3g9p"
      - "GHSA-q3jh-wrc6-jgq8"
      - "GHSA-8r9p-f939-6h3c"
    severity: "HIGH"
    applied_in: "`cases/03-go-to-node/dest/pnpm-workspace.yaml` (override de pnpm)"
    note: >-
      Fuga de cabeceras sensibles al seguir redirecciones cross-origin.
  - ecosystem: "npm"
    package: "form-data"
    from: "override >=4.0.6"
    to: "override >=4.0.6"
    advisories:
      - "CVE-2025-7783"
    severity: "CRITICAL"
    applied_in: "`cases/03-go-to-node/dest/pnpm-workspace.yaml` (override de pnpm)"
    note: >-
      Se conserva el piso ya existente; axios 1.21 resuelve 4.0.6 por si mismo.
